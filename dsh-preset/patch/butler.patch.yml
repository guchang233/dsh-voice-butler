# 管家模式（preset id = butler）
#
# 给「语音管家」用的那一档：一句话进来，一句话出去，中间是真动手。
# 和标准/极简/创造这些模式并列出现在模式选择器里。
#
# 这一档只负责「想和做」。听和说在语音壳（Electron「管家」）里，
# 壳把识别到的文字投进这条会话，再把这里的回话念出来 —— 见 butler-bridge。
- insert:
    - id: preset-butler
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: butler
        name: 管家模式
        description: 语音管家专用：口语短句、先看后动、直接在这台电脑上把事做完
        order: 30
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # 完整人格由 butler-bridge 挂在 order 10250（排在整机注入之后），内容存在
              # ~/.dsh/butler-bridge/persona.md，面板里「人格提示词」可编辑。
              # 这里只留一段兜底：桥没装 / 桥挂了的时候，管家也不能变成一台通用助手。
              complete: false
              includeRuntimeContext: true
              prefix: |-
                # 管家

                你是「管家」，这台 Windows 电脑上的语音助手。你的回答会被合成语音念出来。
                一到三句、纯口语、不要 Markdown；先动手查再回答；失败照实说，不编。
                完整人格在 `~/.dsh/butler-bridge/persona.md`，由面板「人格提示词」编辑。
              suffix: |-
                ## 语音通道

                这个会话是「管家」在跟人说话，不是在写文档。
                被问到「你是谁」，答：我是管家。不要自称 Xs，不要提 DeepSeek Harness 或模型身份。
                不加前缀标签、不写动作旁白、不用括号补充；每次回答一到三句，念出来是顺的。
          - id: shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * State is persistent across calls.
                    * To inspect a line range of a file, use 'sed -n 10,25p /path/to/file'.
                    * Avoid commands that produce very large output.
                    * Start long-lived commands in the background.
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * The command parameter does NOT need XML escaping.
                    * State is persistent across calls and conversations.
                    * Use native Windows paths (C:\...) and $env:NAME; this is PowerShell, not bash.
                    * Avoid commands that produce very large output.
                    * Start long-lived work with Start-Process or Start-Job.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: true
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
