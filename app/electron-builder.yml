appId: com.aibutler.app
productName: 管家
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
      # 原始模型包和 resources/models/kws 重复，大约 36MB，运行时不用
      - '!models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01/**'
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Butler-${version}-${arch}.${ext}
  icon: build/icon.png
  # 这台打包机没有创建符号链接的权限，签名与 rcedit 都用不上，直接跳过
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 管家
